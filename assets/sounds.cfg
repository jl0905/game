# OpenWarband sound overrides (V195). Each line maps an effect to a file in
# assets/sounds/ with an optional gain (default 1.0):
#   <effect> <file> [gain]
# A loaded file replaces the built-in synthesized voice; remove or comment a
# line (or delete the file) and the synth voice comes back — the game always
# has a complete soundscape. Formats: wav, ogg, mp3, flac.
#
# Effects: thud clang loose swing gallop click fanfare knell warcry wood
# Beds (looping, gain ignored - callers set volume): drums wind rain lute music
#
# All shipped files are CC0 from freesound.org - see sounds/CREDITS.txt.

thud    thud.mp3    0.9
clang   clang.mp3   0.8
loose   loose.mp3   0.9
swing   swing.mp3   0.7
gallop  gallop.mp3  0.8
click   click.mp3   0.8
fanfare fanfare.mp3 0.6
warcry  warcry.mp3  0.7
wood    wood.mp3    0.9
drums   drums.mp3
# knell: no good CC0 bell found yet - the synthesized toll stays
