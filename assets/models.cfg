# OpenWarband settlement models (V148). OPTIONAL: when a line below points
# at a real model file, that model replaces the procedural building for its
# role; missing files/keys keep the built-in timber-frame look. Formats:
# .glb/.gltf/.obj (anything raylib LoadModel reads). Paths are relative to
# assets/. Models should be roughly 4 units tall; they are scaled by
# building height and rotated in 90-degree steps per building.
#
# Good CC0 (public domain) sources that drop straight in:
#   Kenney "Castle Kit"    https://kenney.nl/assets/castle-kit      (glb)
#   Kenney "Fantasy Town"  https://kenney.nl/assets/fantasy-town-kit (glb)
#   Quaternius "Medieval"  https://quaternius.com                    (glb)
# Download, copy e.g. towerSquare.glb into assets/models/, then uncomment:
#
#house  models/house.glb
#tavern models/tavern.glb
#keep   models/keep.glb
#wall   models/wall.glb
#tower  models/tower.glb
